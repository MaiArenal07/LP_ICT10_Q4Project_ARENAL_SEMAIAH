<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 Ruby - Classmates</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        body {
            min-height: 100vh;
            background-color: #FFF5F5;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1 {
            color: #4A4A4A;
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        .form-section {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }
        .form-row {
            display: flex;
            gap: 1rem;
            align-items: end;
            flex-wrap: wrap;
        }
        .form-group {
            flex: 1;
            min-width: 180px;
        }
        .form-group label {
            color: #666;
            font-weight: 500;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 0.3rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            background-color: #F8F9FA;
            color: #333;
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            padding: 0.7rem;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #FF6B6B;
            outline: none;
        }
        .btn {
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            border: none;
        }
        .btn-add {
            background: linear-gradient(135deg, #FF6B6B, #FF8E8E);
            color: white;
        }
        .btn-show {
            background: white;
            color: #FF6B6B;
            border: 2px solid #FF6B6B;
        }
        .classmate-list {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .classmate-item {
            background: #FFF5F5;
            border-left: 4px solid #FF6B6B;
            padding: 1rem 1.5rem;
            margin-bottom: 0.8rem;
            border-radius: 0 8px 8px 0;
            color: #4A4A4A;
            font-size: 1rem;
        }
        .classmate-item strong {
            color: #FF6B6B;
        }
        .empty-message {
            text-align: center;
            color: #999;
            padding: 2rem;
            font-style: italic;
        }
        nav {
            background: linear-gradient(135deg, #FF6B6B, #FF8E8E);
            padding: 1rem 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 10px rgba(255, 107, 107, 0.3);
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .nav-brand {
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .nav-links {
            display: flex;
            gap: 10px;
            margin-left: auto;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 20px;
        }
        .nav-links a:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        .nav-links a.active {
            background-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <span class="nav-brand">10 Ruby</span>
            <div class="nav-links">
                <a href="classmates.html">Classmates</a>
                <a href="attendance.html">Attendance Tracker</a>
                <a href="gallery.html">Gallery</a>
                <a href="videos.html">Videos</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <h1>📋 Grade 10 Classmates System</h1>
        <p class="subtitle">Add and view your classmates easily</p>
        
        <div class="form-section">
            <div class="form-row">
                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" placeholder="Enter name...">
                </div>
                <div class="form-group">
                    <label for="studentSection">Section</label>
                    <select id="studentSection">
                        <option value="" disabled selected>Select section...</option>
                        <option value="Emerald">Emerald</option>
                        <option value="Ruby">Ruby</option>
                        <option value="Sapphire">Sapphire</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="studentSubject">Favorite Subject</label>
                    <input type="text" id="studentSubject" placeholder="e.g., Math">
                </div>
                <div class="form-group" style="flex: 1; min-width: auto;">
                    <button class="btn btn-add" onclick="addClassmate()">➕ Add Classmate</button>
                    <button class="btn btn-show" id="showBtn" onclick="toggleList()">👁️ Show List</button>
                </div>
            </div>
        </div>
        
        <div class="classmate-list" id="classmateListContainer" style="display: block;">
            <h3 style="color: #4A4A4A; margin-bottom: 1rem;">Classmate List</h3>
            <div id="classmateList">
                <!-- Classmates will appear here -->
            </div>
        </div>
    </main>

    <script>
        var classmates = [];
        var listVisible = true;
        
        // Show list by default on page load
        renderClassmates();
        
        function addClassmate() {
            var name = document.getElementById('studentName').value.trim();
            var section = document.getElementById('studentSection').value;
            var subject = document.getElementById('studentSubject').value.trim();
            
            if (!name || !section || !subject) {
                alert('Please fill in all fields!');
                return;
            }
            
            classmates.push({ name: name, section: section, subject: subject });
            document.getElementById('studentName').value = '';
            document.getElementById('studentSection').selectedIndex = 0;
            document.getElementById('studentSubject').value = '';
            
            renderClassmates();
        }
        
        function toggleList() {
            listVisible = !listVisible;
            var container = document.getElementById('classmateListContainer');
            var btn = document.getElementById('showBtn');
            
            if (listVisible) {
                container.style.display = 'block';
                btn.textContent = '🙈 Hide List';
            } else {
                container.style.display = 'none';
                btn.textContent = '👁️ Show List';
            }
        }
        
        function renderClassmates() {
            var listDiv = document.getElementById('classmateList');
            if (classmates.length === 0) {
                listDiv.innerHTML = '<div class="empty-message">No classmates added yet. Be the first!</div>';
                return;
            }
            var html = '';
            for (var i = 0; i < classmates.length; i++) {
                html += '<div class="classmate-item">Hi!! I\'m <strong>' + classmates[i].name + '</strong>, I\'m from <strong>' + classmates[i].section + '</strong> and my favorite subject is <strong>' + classmates[i].subject + '</strong>!</div>';
            }
            listDiv.innerHTML = html;
        }
    </script>
</body>
</html>
