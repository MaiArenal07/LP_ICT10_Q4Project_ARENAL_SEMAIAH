<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 Ruby's Attendance Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #FFF5F5;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        .main-content {
            display: flex;
            gap: 3rem;
            align-items: flex-start;
            justify-content: center;
        }
        .input-section {
            flex: 0 0 300px;
            background-color: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .graph-section {
            flex: 0 0 600px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 1rem;
        }
        .input-group > div {
            width: 100%;
        }
        #graph-area {
            border: none;
            border-radius: 12px;
            padding: 1.5rem;
            background-color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #4A4A4A;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }
        label {
            color: #666;
            font-weight: 500;
            font-size: 0.9rem;
        }
        select, input {
            background-color: #F8F9FA;
            color: #333;
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            padding: 0.7rem;
            transition: border-color 0.3s;
        }
        select:focus, input:focus {
            border-color: #FF6B6B;
            outline: none;
        }
        /* Navbar Styles */
        nav {
            background: linear-gradient(135deg, #FF6B6B, #FF8E8E);
            padding: 1rem 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 10px rgba(255, 107, 107, 0.3);
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .nav-brand {
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .nav-links {
            display: flex;
            gap: 10px;
            margin-left: auto;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 20px;
            transition: all 0.3s;
            white-space: nowrap;
            font-weight: 500;
        }
        .nav-links a:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        .nav-links a.active {
            background-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav>
        <div class="nav-container">
            <span class="nav-brand">10 Ruby</span>
            <div class="nav-links">
                <a href="classmates.html">Classmates</a>
                <a href="attendance.html">Attendance Tracker</a>
                <a href="gallery.html">Gallery</a>
                <a href="videos.html">Videos</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <h2>10 Ruby's Attendance Tracker</h2>
        
        <div class="main-content">
            <div class="input-section">
                <div class="input-group">
                    <div>
                        <label for="dayInput">Day of the Week</label>
                        <select id="dayInput" required>
                            <option value="" disabled selected>Select a day...</option>
                            <option value="Monday">Monday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                        </select>
                    </div>
                    <div>
                        <label for="absenceInput">Number of Absences</label>
                        <input type="number" id="absenceInput" min="0" max="50" value="0" required>
                    </div>
                    <div>
                        <button id="add-button" py-click="displaying" style="background: linear-gradient(135deg, #FF6B6B, #FF8E8E); border: none; color: white; font-weight: bold; width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; transition: transform 0.2s; box-shadow: 0 4px 6px rgba(255, 107, 107, 0.3);">Add Data</button>
                    </div>
                </div>
            </div>
            
            <div class="graph-section">
                <div id="graph-area">
                    <div id="graph-container"></div>
                </div>
            </div>
        </div>
    </main>

    <py-config>
        packages = ["numpy", "matplotlib"]
    </py-config>

    <script type="py" src="./main.py"></script>
</body>
</html>
